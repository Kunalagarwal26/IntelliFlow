[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "intelliflow-backend"
version = "0.1.0"
description = "Backend services for the IntelliFlow Enterprise AI Knowledge & Automation Platform"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.28,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]